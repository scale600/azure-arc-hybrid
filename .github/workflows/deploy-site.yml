name: Deploy Site

# Deploys on push to site/** and on Snapshot workflow completion.
# workflow_run is required because a GITHUB_TOKEN push does not trigger other workflows.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Snapshot"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "site/dist"
          skip_app_build: true
