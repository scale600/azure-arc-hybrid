name: Cleanup VM Resources

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  cleanup:
    name: Delete orphaned VM resources
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Fetch OIDC token
        run: |
          TOKEN=$(curl -sSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          echo "ARM_OIDC_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Az login (OIDC)
        run: |
          az login --service-principal \
            -u "$AZURE_CLIENT_ID" \
            -t "$AZURE_TENANT_ID" \
            --federated-token "$ARM_OIDC_TOKEN"
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Delete orphaned VM resources
        run: |
          RG="arc-hybrid-lab"
          az network nic delete -g "$RG" -n "cloud-vm-nic" 2>/dev/null || echo "nic already gone"
          az network vnet delete -g "$RG" -n "cloud-vm-vnet" 2>/dev/null || echo "vnet already gone"
          az network nsg delete -g "$RG" -n "cloud-vm-nsg" 2>/dev/null || echo "nsg already gone"
          az network public-ip delete -g "$RG" -n "cloud-vm-pip" 2>/dev/null || echo "pip already gone"
          echo "cleanup complete"
