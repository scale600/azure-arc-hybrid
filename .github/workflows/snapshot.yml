name: Snapshot

# Refresh site/src/data/snapshot.json from Azure (Arc inventory + policy compliance)
# via OIDC (no secrets). The committed JSON drives the Cloudflare Pages build.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write

jobs:
  snapshot:
    name: Snapshot
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: arc-hybrid-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fetch the GitHub OIDC token for Azure federated (workload-identity) login.
      - name: Fetch OIDC token
        run: |
          TOKEN=$(curl -sSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          echo "ARM_OIDC_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Az login (OIDC)
        run: |
          az login --service-principal \
            -u "$AZURE_CLIENT_ID" \
            -t "$AZURE_TENANT_ID" \
            --federated-token "$ARM_OIDC_TOKEN"
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Generate snapshot
        run: bash scripts/snapshot.sh

      - name: Commit snapshot (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain site/src/data/snapshot.json)" ]]; then
            git add site/src/data/snapshot.json
            git commit -m "chore: refresh snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "snapshot.json unchanged"
          fi
