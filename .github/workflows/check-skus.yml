name: Check VM SKUs

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  check:
    name: List B-series SKUs
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Fetch OIDC token
        run: |
          TOKEN=$(curl -sSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          echo "ARM_OIDC_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Az login (OIDC)
        run: |
          az login --service-principal \
            -u "$AZURE_CLIENT_ID" \
            -t "$AZURE_TENANT_ID" \
            --federated-token "$ARM_OIDC_TOKEN"
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: List deployable SKUs (no capacity restriction) for cheap families
        run: |
          for loc in eastasia koreacentral; do
            echo "=== $loc deployable A/B/D/F SKUs (capacity-available only) ==="
            az vm list-skus -l "$loc" --query "[?contains(name,'Standard_D')||contains(name,'Standard_A')||contains(name,'Standard_F')||contains(name,'Standard_B')].name" -o tsv | sort -u
          done
