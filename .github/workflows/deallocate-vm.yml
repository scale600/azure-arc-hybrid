name: Deallocate VM

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deallocate:
    name: Deallocate cloud-vm (cost control)
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Fetch OIDC token
        run: |
          TOKEN=$(curl -sSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          echo "ARM_OIDC_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Az login (OIDC)
        run: |
          az login --service-principal \
            -u "$AZURE_CLIENT_ID" \
            -t "$AZURE_TENANT_ID" \
            --federated-token "$ARM_OIDC_TOKEN"
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Deallocate cloud-vm
        run: |
          RG="arc-hybrid-lab"
          az vm deallocate -g "$RG" -n "cloud-vm" --no-wait 2>/dev/null || echo "deallocate failed or already deallocated"
          echo "deallocate triggered"
